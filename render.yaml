# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
# Secrets marked `sync: false` are entered in the dashboard; they are never stored in git.
services:
  - type: web
    name: ai-test-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    domains:
      - aitestge.stream
      - www.aitestge.stream
    envVars:
      - key: APP_ENV
        value: production
      # Set in the dashboard, not here, so a Blueprint sync never overwrites it: the public URL the
      # site is opened on (https://aitestge.stream once DNS works, else the *.onrender.com URL).
      - key: APP_BASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-pro
      # Tried in order when GEMINI_MODEL cannot answer (404 / quota / overloaded). "none" = no fallback.
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3-flash-preview,gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: MAX_REPO_FILES
        value: "25"
