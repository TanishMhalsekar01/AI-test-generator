name: live-check

# Smoke-test the deployed site from GitHub's runners: health, sign-in wiring,
# page delivery and security headers. Run it from the Actions tab after a deploy.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL of the deployed site
        default: https://ai-test-generator-6bv7.onrender.com
  push:
    paths: [".github/workflows/live-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url || 'https://ai-test-generator-6bv7.onrender.com' }}
    steps:
      - name: Wake the service
        # Sleeping Render instances can take about a minute to answer the first request.
        run: |
          curl -s -o /dev/null -m 150 -w "first response: %{http_code} after %{time_total}s\n" "$URL/healthz" || true

      - name: Probe endpoints
        run: |
          probe() {
            printf '\n== %s\n' "$1"
            curl -sS -m 60 -o /tmp/body -D /tmp/headers -w 'HTTP %{http_code} in %{time_total}s\n' "$URL$1" || true
            grep -i '^location:' /tmp/headers || true
          }
          probe /healthz;              cat /tmp/body; echo
          probe /auth/status;          cat /tmp/body; echo
          probe /
          grep -o '<title>[^<]*</title>' /tmp/body || true
          probe /app
          probe /api/me;               cat /tmp/body; echo
          probe /auth/github/login
          grep -io 'redirect_uri=[^&]*' /tmp/headers || true
          probe /assets/js/signin.js
          grep -q "auth/status" /tmp/body && echo "sign-in page: has configuration check" || echo "sign-in page: old build (no configuration check)"
          probe /assets/js/app.js
          probe /assets/css/app.css

      - name: HTTP to HTTPS redirect
        run: |
          curl -sS -m 60 -o /dev/null -w 'HTTP %{http_code} -> %{redirect_url}\n' "${URL/https:/http:}/" || true

      - name: Security headers
        run: |
          curl -sS -m 60 -D - -o /dev/null "$URL/" | grep -iE '^(content-security-policy|strict-transport-security|x-frame-options|x-content-type-options):' || true
